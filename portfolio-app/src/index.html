<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Mazisi Dungelo</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Developer portfolio showcasing experience, projects, and contact information.">
  <link rel="icon" type="image/svg+xml" href="favicon.svg?v=4">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&family=Outfit:wght@500;600;700;800;900&display=swap"
    rel="stylesheet"
  >
  <!--
    Counterpart to public/404.html: decodes a path that GitHub Pages'
    404 redirect encoded into the query string (see rafgraph/spa-github-pages)
    and restores it via history.replaceState before Angular's router boots,
    so deep links like /about work when GitHub Pages serves this as a 404.
  -->
  <script>
    (function (l) {
      if (l.search[1] === '/') {
        var decoded = l.search.slice(1).split('&').map(function (s) {
          return s.replace(/~and~/g, '&');
        }).join('?');
        window.history.replaceState(null, null,
          l.pathname.slice(0, -1) + decoded + l.hash
        );
      }
    }(window.location));
  </script>
</head>
<body>
  <app-root></app-root>
</body>
</html>
