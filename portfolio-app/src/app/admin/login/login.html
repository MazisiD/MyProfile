<section class="login-page">
  <form class="card login-form" (ngSubmit)="onSubmit()">
    <h2>Admin Login</h2>

    @if (error()) {
      <p class="error">{{ error() }}</p>
    }

    <div class="form-field">
      <label for="email">Email</label>
      <input id="email" name="email" type="email" required [ngModel]="email()" (ngModelChange)="email.set($event)" />
    </div>

    <div class="form-field">
      <label for="password">Password</label>
      <input id="password" name="password" type="password" required [ngModel]="password()" (ngModelChange)="password.set($event)" />
    </div>

    <button type="submit" class="btn btn-primary" [disabled]="isSubmitting()">
      {{ isSubmitting() ? 'Signing in...' : 'Sign In' }}
    </button>
  </form>
</section>
