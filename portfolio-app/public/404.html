<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Redirecting...</title>
  <!--
    GitHub Pages has no server-side rewrites, so any direct hit to a route
    like /about or /admin returns this 404 page. This script encodes the
    requested path into the query string and redirects to the site root,
    where the matching inline script in index.html decodes it and uses
    history.replaceState to restore the original URL for Angular's router.
    Pattern: https://github.com/rafgraph/spa-github-pages
  -->
  <script>
    var pathSegmentsToKeep = 0; // 1 if deployed to a project page (e.g. /MyProfile/)
    var l = window.location;
    l.replace(
      l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
      l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?/' +
      l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
      (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
      l.hash
    );
  </script>
</head>
<body>
</body>
</html>
